[project]
name = "api-processor"
version = "0.1.0"
description = "Process large files with API calls using DuckDB control"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0.0",
    "httpx>=0.27.0",
    "h2>=4.0.0",
    "orjson>=3.10.0",
    "typer>=0.12.0",
    "psutil>=7.1.3",
    "tabulate>=0.9.0",
    "colorama>=0.4.6",
    "rich>=14.2.0",
]

[project.scripts]
api-processor = "api_processor.main:app"

[tool.uv]
package = true


